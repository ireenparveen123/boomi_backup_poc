name: Boomi Build and Deploy to Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: true
        default: 'Manual deploy to Test'

jobs:
  # ============================================================
  # JOB 1: BUILD - Create Boomi Package
  # ============================================================
  build:
    name: 'Build - Create Boomi Package'
    runs-on: [self-hosted, windows, boomi]

    outputs:
      package_id: ${{ steps.create_package.outputs.package_id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Build Info
        shell: bash
        run: |
          echo "=================================================="
          echo " BUILD - Creating Boomi Package"
          echo "=================================================="
          echo "  Triggered by : ${{ github.actor }}"
          echo "  Branch       : ${{ github.ref_name }}"
          echo "  Commit SHA   : ${{ github.sha }}"
          echo "  Run Number   : ${{ github.run_number }}"
          echo ""

      - name: Read Component IDs from Deployment Details
        id: read_component_ids
        shell: bash
        run: |
          echo "=================================================="
          echo " Reading Component IDs from Deployment Details"
          echo "=================================================="

          # Repository-relative path to the deployment details file.
          # Change only this filename if your actual file has a different name.
          DEPLOYMENT_DETAILS_FILE="components/deployment_details.csv"

          if [ ! -f "$DEPLOYMENT_DETAILS_FILE" ]; then
            echo "ERROR: Deployment details file not found:"
            echo "       $DEPLOYMENT_DETAILS_FILE"
            echo ""
            echo "Files available under boomi_backup_poc/components:"
            find boomi_backup_poc/components -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Found: $DEPLOYMENT_DETAILS_FILE"

          # Extract every componentId from the deployment details JSON.
          # Recursive search is used so componentId can be nested at any level.
          python3 - "$DEPLOYMENT_DETAILS_FILE" <<'PY' > component_ids.txt
          import json
          import sys

          file_path = sys.argv[1]

          with open(file_path, "r", encoding="utf-8") as f:
              data = json.load(f)

          component_ids = []

          def collect_component_ids(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key.lower() == "componentid" and child:
                          if isinstance(child, str):
                              component_ids.append(child.strip())
                          elif isinstance(child, (int, float)):
                              component_ids.append(str(child))
                      collect_component_ids(child)

              elif isinstance(value, list):
                  for item in value:
                      collect_component_ids(item)

          collect_component_ids(data)
