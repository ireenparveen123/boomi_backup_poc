# =============================================
# GitHub Actions: Boomi Build & Deploy to Test
# Trigger: Push to main branch
# Runner: Self-hosted Windows with Git Bash
# =============================================

name: Boomi Build and Deploy to Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: true
        default: 'Manual deploy to Test'

jobs:

# ============================================
# JOB 1: BUILD - Create Boomi Package
# ============================================
  build:
    name: '🔨 Build - Create Boomi Package'
    runs-on: [self-hosted, windows, boomi]

    outputs:
      package_count: ${{ steps.create_packages.outputs.package_count }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Build Info
        shell: bash
        run: |
          echo "=================================================="
          echo " BUILD - Creating Boomi Packages"
          echo "=================================================="
          echo "  Triggered by : ${{ github.actor }}"
          echo "  Branch       : ${{ github.ref_name }}"
          echo "  Commit SHA   : ${{ github.sha }}"
          echo "  Run Number   : ${{ github.run_number }}"
          echo ""
          python3 << 'PYEOF'
          import csv
          with open('components/deployment_details.csv', newline='') as f:
              rows = [r for r in csv.DictReader(f) if r['component_id'].strip()]
          print(f"  Components to package ({len(rows)} total):")
          for i, row in enumerate(rows, 1):
              print(f"    [{i}] {row['component_name'].strip()} ({row['component_id'].strip()})")
          PYEOF
          echo ""

      - name: Create Boomi Packages via API
        id: create_packages
        shell: bash
        run: |
          echo "Calling PackagedComponent API for each component..."
          echo ""

          # Build version number
          VERSION="1.0.${{ github.run_number }}"
          echo "Package Version: $VERSION"
          echo ""

          # Store secrets in variables safely
          USERNAME="${{ secrets.BOOMI_USERNAME }}"
          API_TOKEN="${{ secrets.BOOMI_API_TOKEN }}"
          ACCOUNT_ID="${{ secrets.BOOMI_ACCOUNT_ID }}"

          # Clear output file
          > package_ids.txt

          PACKAGE_COUNT=0
          FAILED=0

          # Total component count for progress display
          TOTAL=$(python3 -c "
import csv
with open('components/deployment_details.csv', newline='') as f:
    print(sum(1 for r in csv.DictReader(f) if r['component_id'].strip()))
          ")

          CURRENT=0

          # Parse CSV and loop over each component (newline='' avoids CRLF issues on Windows)
          while IFS='|' read -r COMPONENT_ID COMPONENT_NAME; do
            CURRENT=$((CURRENT + 1))
            echo "--------------------------------------------------"
            echo "Component ($CURRENT/$TOTAL) : $COMPONENT_NAME"
            echo "ID                        : $COMPONENT_ID"

            # Build JSON payload
            JSON_PAYLOAD=$(python3 -c "
import json
payload = {
    'componentId': '$COMPONENT_ID',
    'packageVersion': '$VERSION',
    'notes': 'Auto-packaged by GitHub Actions Run #${{ github.run_number }}'
}
print(json.dumps(payload))
            ")

            echo "Payload   : $JSON_PAYLOAD"

            # Call Boomi PackagedComponent API
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -u "$USERNAME:$API_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "$JSON_PAYLOAD" \
              "https://api.boomi.com/api/rest/v1/$ACCOUNT_ID/PackagedComponent")

            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            echo "HTTP Status : $HTTP_STATUS"
            echo "Response    : $BODY"

            if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
              echo "ERROR: Package creation failed for $COMPONENT_NAME (HTTP $HTTP_STATUS)"
              FAILED=$((FAILED + 1))
              echo ""
              continue
            fi

            # Extract Package ID from response
            PACKAGE_ID=$(echo "$BODY" | python3 -c "
import sys, json
data = json.load(sys.stdin)
pkg_id = data.get('packageId') or data.get('id') or 'NOT_FOUND'
print(pkg_id)
            ")

            if [ -z "$PACKAGE_ID" ] || [ "$PACKAGE_ID" == "NOT_FOUND" ]; then
              echo "ERROR: Could not extract packageId for $COMPONENT_NAME"
              FAILED=$((FAILED + 1))
              echo ""
              continue
            fi

            echo "Package ID  : $PACKAGE_ID"
            echo "$PACKAGE_ID|$COMPONENT_NAME" >> package_ids.txt
            PACKAGE_COUNT=$((PACKAGE_COUNT + 1))
            echo ""

          done < <(python3 -c "
import csv
with open('components/deployment_details.csv', newline='') as f:
    for row in csv.DictReader(f):
        cid = row['component_id'].strip()
        cname = row['component_name'].strip()
        if cid:
            print(cid + '|' + cname)
          ")

          echo "=================================================="
          echo "Packages created : $PACKAGE_COUNT"
          echo "Failures         : $FAILED"
          echo "=================================================="

          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED component(s) failed to package. Aborting."
            exit 1
          fi

          echo "package_count=$PACKAGE_COUNT" >> $GITHUB_OUTPUT
          echo "Package IDs saved to package_ids.txt"

      - name: Upload Package IDs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boomi-package-info
          path: package_ids.txt
          retention-days: 5


# ============================================
# JOB 2: DEPLOY TO TEST
# ============================================
  deploy-test:
    name: '🚀 Deploy to Test Environment'
    runs-on: [self-hosted, windows, boomi]
    needs: build

    steps:

      - name: Download Package IDs Artifact
        uses: actions/download-artifact@v4
        with:
          name: boomi-package-info

      - name: Display Deploy Info
        shell: bash
        run: |
          echo "=================================================="
          echo " DEPLOY TO TEST"
          echo "=================================================="
          echo "  Deployed by    : ${{ github.actor }}"
          echo "  Packages to deploy (${{ needs.build.outputs.package_count }} total):"
          while IFS='|' read -r PACKAGE_ID COMPONENT_NAME; do
            echo "    - $COMPONENT_NAME ($PACKAGE_ID)"
          done < package_ids.txt
          echo ""

      - name: Deploy to Test via Boomi API
        shell: bash
        run: |
          echo "Calling DeployedPackage API for each package..."
          echo ""

          # Store secrets safely
          USERNAME="${{ secrets.BOOMI_USERNAME }}"
          API_TOKEN="${{ secrets.BOOMI_API_TOKEN }}"
          ACCOUNT_ID="${{ secrets.BOOMI_ACCOUNT_ID }}"
          ENV_ID="${{ secrets.BOOMI_TEST_ENV_ID }}"

          DEPLOY_COUNT=0
          FAILED=0
          TOTAL=$(wc -l < package_ids.txt | tr -d '[:space:]')
          CURRENT=0

          while IFS='|' read -r PACKAGE_ID COMPONENT_NAME; do
            PACKAGE_ID=$(echo "$PACKAGE_ID" | tr -d '[:space:]')
            CURRENT=$((CURRENT + 1))
            echo "--------------------------------------------------"
            echo "Component ($CURRENT/$TOTAL) : $COMPONENT_NAME"
            echo "Package ID               : $PACKAGE_ID"

            # Build JSON payload
            JSON_PAYLOAD=$(python3 -c "
import json
payload = {
    'environmentId': '$ENV_ID',
    'packageId': '$PACKAGE_ID',
    'notes': 'Deployed to TEST by GitHub Actions Run #${{ github.run_number }}'
}
print(json.dumps(payload))
            ")

            echo "Payload    : $JSON_PAYLOAD"

            # Call Boomi DeployedPackage API
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -u "$USERNAME:$API_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "$JSON_PAYLOAD" \
              "https://api.boomi.com/api/rest/v1/$ACCOUNT_ID/DeployedPackage")

            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            echo "HTTP Status : $HTTP_STATUS"
            echo "Response    : $BODY"

            if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
              echo "ERROR: Deployment failed for $COMPONENT_NAME (HTTP $HTTP_STATUS)"
              FAILED=$((FAILED + 1))
              echo ""
              continue
            fi

            echo "✅ Deployed: $COMPONENT_NAME"
            DEPLOY_COUNT=$((DEPLOY_COUNT + 1))
            echo ""

          done < package_ids.txt

          echo "=================================================="
          echo "Deployed : $DEPLOY_COUNT"
          echo "Failures : $FAILED"
          echo "=================================================="

          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED component(s) failed to deploy."
            exit 1
          fi

      - name: Deployment Summary
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo " DEPLOYMENT TO TEST COMPLETE!"
          echo "=================================================="
          echo ""
          echo "  Packages Created      : ${{ needs.build.outputs.package_count }}"
          echo "  Deployed to Test      : YES"
          echo "  Build Number          : ${{ github.run_number }}"
          echo "  Triggered by          : ${{ github.actor }}"
          echo ""
          echo "Next Steps:"
          echo "  Go to Boomi AtomSphere"
          echo "  Manage - Atom Management"
          echo "  Verify processes are deployed in Test"
          echo ""
