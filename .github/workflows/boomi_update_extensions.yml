## `components/build_extensions_payload.py`

```python
#!/usr/bin/env python3
"""
Reads extension_details.csv and generates one Boomi EnvironmentExtensions
JSON payload per unique (component_id, target_environment) group.

Outputs:
  extension_payloads/<component_id>__<environment>.json   (one per group)
  extension_payloads/manifest.txt                         (filename|comp|env per line)

SECRET: handling
  field_value = SECRET:sap_uat_pwd  ->  os.environ["SAP_UAT_PWD"]
  Missing env-var prints WARNING and leaves the placeholder so the API
  call fails visibly rather than silently.
"""

import csv, json, os, sys
from collections import defaultdict
from pathlib import Path

SECRET_PREFIX = "SECRET:"

def resolve_value(raw):
    raw = raw.strip()
    if raw.startswith(SECRET_PREFIX):
        key = raw[len(SECRET_PREFIX):].strip().upper()
        val = os.environ.get(key)
        if val is None:
            print(f"  WARNING: env-var '{key}' not set — leaving placeholder")
            return raw
        return val
    return raw

def is_encrypted(raw):
    return raw.strip().startswith(SECRET_PREFIX)

def load_csv(path):
    data = defaultdict(lambda: defaultdict(lambda: defaultdict(list)))
    with open(path, newline="", encoding="utf-8-sig") as fh:
        for row in csv.DictReader(fh):
            comp = row["component_id"].strip()
            if not comp:
                continue
            data[(comp, row["target_environment"].strip())] \
                [row["extension_type"].strip()] \
                [row["extension_name"].strip()].append(row)
    return data

def build_process_properties(ext_map):
    props = []
    for name, rows in ext_map.items():
        props.append({
            "@type": "ProcessProperty", "name": name,
            "ProcessPropertyValue": [
                {"@type": "ProcessPropertyValue",
                 "key": r["field_name"].strip(),
                 "value": resolve_value(r["field_value"])} for r in rows
            ]
        })
    return {"@type": "ProcessPropertyMap", "ProcessProperty": props}

def build_dynamic_process_properties(ext_map):
    dpp = []
    for name, rows in ext_map.items():
        for r in rows:
            dpp.append({"@type": "DynamicProcessProperty",
                        "name": name,
                        "value": resolve_value(r["field_value"])})
    return {"@type": "DynamicProcessPropertyMap", "DynamicProcessProperty": dpp}

def build_connections(ext_map):
    conns = []
    for conn_id, rows in ext_map.items():
        fields = []
        for r in rows:
            fe = {"@type": "OverrideConnectionField",
                  "id":    r["field_name"].strip(),
                  "value": resolve_value(r["field_value"])}
            if is_encrypted(r["field_value"]):
                fe["encryptedValueSet"] = True
                fe["usesEncryption"]    = True
            fields.append(fe)
        conns.append({"@type": "OverrideConnection", "id": conn_id, "field": fields})
    return {"@type": "ConnectionMap", "Connection": conns}

def build_cross_references(ext_map):
    xrefs = []
    for xref_id, rows in ext_map.items():
        row_groups = defaultdict(list)
        for r in rows:
            row_groups[int(r["row_id"].strip() or "1")].append(r)
        xref_rows = []
        for rnum in sorted(row_groups):
            xref_rows.append({
                "@type": "CrossReferenceRow", "rowNum": rnum,
                "CrossReferenceRowData": [
                    {"@type": "CrossReferenceRowData",
                     "key":   r["field_name"].strip(),
                     "value": resolve_value(r["field_value"])}
                    for r in row_groups[rnum]
                ]
            })
        xrefs.append({"@type": "CrossReferenceElement",
                      "id": xref_id, "CrossReferenceRow": xref_rows})
    return {"@type": "CrossReferenceMap", "CrossReference": xrefs}

BUILDERS = {
    "PROCESS_PROPERTY":         (build_process_properties,         "processProperties"),
    "DYNAMIC_PROCESS_PROPERTY": (build_dynamic_process_properties, "dynamicProcessProperties"),
    "CONNECTION":               (build_connections,                 "connections"),
    "CROSS_REFERENCE":          (build_cross_references,            "crossReferences"),
}

def build_payload(comp_id, env, type_map):
    payload = {"@type": "EnvironmentExtensions",
               "extensionGroupId": comp_id,
               "environmentId":    env}
    for ext_type, ext_map in type_map.items():
        if ext_type in BUILDERS:
            fn, key = BUILDERS[ext_type]
            payload[key] = fn(ext_map)
        else:
            print(f"  WARNING: Unknown extension_type '{ext_type}' — skipped")
    return payload

def main():
    csv_path = sys.argv[1] if len(sys.argv) > 1 else "components/extension_details.csv"
    if not os.path.exists(csv_path):
        print(f"ERROR: {csv_path} not found"); sys.exit(1)

    out_dir = Path("extension_payloads")
    out_dir.mkdir(exist_ok=True)

    data = load_csv(csv_path)
    print(f"Processing {len(data)} group(s)...\n")

    manifest_lines = []
    for (comp_id, env), type_map in data.items():
        print(f"  Component: {comp_id}  Env: {env}")
        for et, em in type_map.items():
            print(f"    {et}: {list(em.keys())}")

        fname = f"{comp_id}__{env}.json".replace("/", "_").replace(" ", "_")
        with open(out_dir / fname, "w", encoding="utf-8") as fh:
            json.dump(build_payload(comp_id, env, type_map), fh, indent=2)
        print(f"  -> {out_dir / fname}\n")
        manifest_lines.append(f"{fname}|{comp_id}|{env}")

    with open(out_dir / "manifest.txt", "w") as fh:
        fh.write("\n".join(manifest_lines) + "\n")

    print(f"Done. {len(data)} payload(s) written.")

if __name__ == "__main__":
    main()
```

---

## Secrets required

| Secret | Purpose |
|---|---|
| `BOOMI_USERNAME` | API auth (shared with deploy workflow) |
| `BOOMI_API_TOKEN` | API auth (shared with deploy workflow) |
| `BOOMI_ACCOUNT_ID` | Boomi account ID |
| `BOOMI_UAT_ENV_ID` | Real Boomi environment ID for UAT |
| `BOOMI_TEST_ENV_ID` | Real Boomi environment ID for TEST |
| `BOOMI_PROD_ENV_ID` | Real Boomi environment ID for PROD |
| `SAP_UAT_PWD` | Resolves `SECRET:sap_uat_pwd` in the CSV |

## How `SECRET:` values work

Any `field_value` starting with `SECRET:` is a secret reference:
```
SECRET:sap_uat_pwd  ->  uppercased  ->  SAP_UAT_PWD  ->  ${{ secrets.SAP_UAT_PWD }}
```
To add a new secret field: put `SECRET:my_secret_name` in the CSV, then add one line to the `env:` block of the **Build Extension Payloads** step:
```yaml
MY_SECRET_NAME: ${{ secrets.MY_SECRET_NAME }}
```

## How Cross-Reference rows are grouped

Rows with the same `extension_name` and `row_id` merge into one `CrossReferenceRow`.

```
CountryCodeXref, source_country, 1, IN     -> row 1, col source_country
CountryCodeXref, target_country, 1, India  -> row 1, col target_country
CountryCodeXref, source_country, 2, US     -> row 2, col source_country
CountryCodeXref, target_country, 2, ...    -> row 2, col target_country
```

## Trigger behaviour

| Event | When it runs |
|---|---|
| Push to `main` | Only when `extensions/extension_details.csv` is changed |
| `workflow_dispatch` | Manually from the Actions tab |
