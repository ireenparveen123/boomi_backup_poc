# Boomi Update Environment Extensions


---

## `.github/workflows/boomi-update-extensions.yml`

```yaml
# =============================================
# GitHub Actions: Boomi Update Environment Extensions
# Trigger: Push to main (when extension_details.csv changes)
#          or manual workflow_dispatch
# Runner: Self-hosted Windows with Git Bash
# CSV: components/extension_details.csv
# =============================================

name: Boomi Update Environment Extensions

on:
  push:
    branches:
      - main
    paths:
      - 'components/extension_details.csv'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for extension update'
        required: true
        default: 'Manual extension update'

jobs:

# ============================================
# JOB: UPDATE ENVIRONMENT EXTENSIONS
# ============================================
  update-extensions:
    name: 'Update Environment Extensions'
    runs-on: [self-hosted, windows, boomi]

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Extension Update Info
        shell: bash
        run: |
          echo "=================================================="
          echo " UPDATE ENVIRONMENT EXTENSIONS"
          echo "=================================================="
          echo "  Triggered by : ${{ github.actor }}"
          echo "  Branch       : ${{ github.ref_name }}"
          echo "  Commit SHA   : ${{ github.sha }}"
          echo "  Run Number   : ${{ github.run_number }}"
          echo "  Reason       : ${{ github.event.inputs.reason || 'Push to main' }}"
          echo ""
          echo "  Extensions CSV : extensions/extension_details.csv"
          echo ""
          echo "  Rows to process:"
          ROWNUM=0
          while IFS=',' read -r comp_id target_env ext_type ext_name field_name row_id field_value; do
            [ "$comp_id" = "component_id" ] && continue
            [ -z "$(echo "$comp_id" | tr -d '[:space:]')" ] && continue
            ROWNUM=$((ROWNUM + 1))
            echo "    [$ROWNUM] $(echo $comp_id | tr -d '\r[:space:]') | $target_env | $(echo $ext_type | tr -d '\r[:space:]') | $(echo $ext_name | tr -d '\r[:space:]').$(echo $field_name | tr -d '\r[:space:]')"
          done < extensions/extension_details.csv
          echo ""

      - name: Build Extension Payloads
        id: build_payloads
        shell: bash
        env:
          # ---------------------------------------------------------------
          # Map each SECRET:<name> in the CSV to a GitHub secret.
          # Variable name must be the UPPERCASED secret_name from the CSV.
          #   CSV value           -> env-var name   -> GitHub secret
          #   SECRET:sap_uat_pwd  -> SAP_UAT_PWD    -> secrets.SAP_UAT_PWD
          # ---------------------------------------------------------------
          SAP_UAT_PWD: ${{ secrets.SAP_UAT_PWD }}
          # Add more mappings below as needed:
          # MY_OTHER_SECRET: ${{ secrets.MY_OTHER_SECRET }}
        run: |
          echo "Running payload builder..."
          python3 extensions/build_extensions_payload.py extensions/extension_details.csv
          echo ""
          PAYLOAD_COUNT=$(wc -l < extension_payloads/manifest.txt | tr -d '[:space:]')
          echo "payload_count=$PAYLOAD_COUNT" >> $GITHUB_OUTPUT
          echo "Payload groups built: $PAYLOAD_COUNT"

      - name: Update Extensions via Boomi API
        shell: bash
        run: |
          echo "Calling EnvironmentExtensions API for each payload..."
          echo ""

          USERNAME="${{ secrets.BOOMI_USERNAME }}"
          API_TOKEN="${{ secrets.BOOMI_API_TOKEN }}"
          ACCOUNT_ID="${{ secrets.BOOMI_ACCOUNT_ID }}"

          # Map logical environment names from the CSV to real Boomi environment IDs.
          # Add an entry here for each target_environment value in the CSV.
          declare -A ENV_ID_MAP
          ENV_ID_MAP["UAT"]="${{ secrets.BOOMI_UAT_ENV_ID }}"
          ENV_ID_MAP["TEST"]="${{ secrets.BOOMI_TEST_ENV_ID }}"
          ENV_ID_MAP["PROD"]="${{ secrets.BOOMI_PROD_ENV_ID }}"
          # ENV_ID_MAP["STAGING"]="${{ secrets.BOOMI_STAGING_ENV_ID }}"

          TOTAL=$(wc -l < extension_payloads/manifest.txt | tr -d '[:space:]')
          CURRENT=0
          FAILED=0
          SUCCESS=0

          while IFS='|' read -r filename comp_id env_name; do
            CURRENT=$((CURRENT + 1))
            comp_id=$(echo "$comp_id" | tr -d '[:space:]')
            env_name=$(echo "$env_name" | tr -d '\r[:space:]')
            payload_file="extension_payloads/$filename"

            echo "--------------------------------------------------"
            echo "Update ($CURRENT/$TOTAL)"
            echo "  Component  : $comp_id"
            echo "  Environment: $env_name"
            echo "  Payload    : $payload_file"

            BOOMI_ENV_ID="${ENV_ID_MAP[$env_name]}"
            if [ -z "$BOOMI_ENV_ID" ]; then
              echo "  ERROR: No Boomi env ID mapped for '$env_name'"
              echo "         Add BOOMI_${env_name}_ENV_ID to secrets and ENV_ID_MAP."
              FAILED=$((FAILED + 1))
              echo ""
              continue
            fi

            # Inject the real environment ID into the payload
            FINAL_PAYLOAD=$(python3 -c "
import json
with open('$payload_file') as f:
    d = json.load(f)
d['environmentId'] = '$BOOMI_ENV_ID'
print(json.dumps(d))
")

            echo "  Env ID     : $BOOMI_ENV_ID"

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -u "$USERNAME:$API_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d "$FINAL_PAYLOAD" \
              "https://api.boomi.com/api/rest/v1/$ACCOUNT_ID/EnvironmentExtensions/update")

            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n -1)

            echo "  HTTP Status: $HTTP_STATUS"
            echo "  Response   : $BODY"

            if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
              echo "  ERROR: Extension update failed for $comp_id / $env_name (HTTP $HTTP_STATUS)"
              FAILED=$((FAILED + 1))
              echo ""
              continue
            fi

            echo "  Extensions updated: $comp_id -> $env_name"
            SUCCESS=$((SUCCESS + 1))
            echo ""

          done < extension_payloads/manifest.txt

          echo "=================================================="
          echo "  Updated : $SUCCESS"
          echo "  Failed  : $FAILED"
          echo "  Total   : $TOTAL"
          echo "=================================================="

          if [ "$FAILED" -gt 0 ]; then
            echo "ERROR: $FAILED extension update(s) failed."
            exit 1
          fi

      - name: Summary
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo " ENVIRONMENT EXTENSIONS UPDATE COMPLETE!"
          echo "=================================================="
          echo ""
          echo "  Groups Updated  : ${{ steps.build_payloads.outputs.payload_count }}"
          echo "  Run Number      : ${{ github.run_number }}"
          echo "  Triggered by    : ${{ github.actor }}"
          echo ""
          echo "Next Steps:"
          echo "  Boomi AtomSphere -> Manage -> Environments"
          echo "  Verify extensions are applied to the target environment(s)"
          echo ""
```

