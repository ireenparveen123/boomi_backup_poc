# =============================================
# Azure Pipeline: Boomi Package & Deploy to Test
# Simplified for Testing Only
# =============================================

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: boomi-common-vars

stages:

# ============================================
# STAGE 1: BUILD — Create the Boomi Package
# ============================================
- stage: Build
  displayName: '🔨 Build - Create Boomi Package'
  jobs:
  - job: CreatePackage
    displayName: 'Call PackagedComponent API'
    steps:

    - script: |
        echo "=================================================="
        echo " 🔨 STAGE 1: BUILD - Creating Boomi Package"
        echo "=================================================="
        echo ""
        echo "Build Details:"
        echo "  Build Number    : $(Build.BuildNumber)"
        echo "  Source Branch   : $(Build.SourceBranch)"
        echo "  Commit Message  : $(Build.SourceVersionMessage)"
        echo ""

      displayName: 'Display Build Information'

    - script: |
        echo "Calling PackagedComponent API..."
        echo ""
        echo "Parameters:"
        echo "  Component ID    : $(BOOMI_COMPONENT_ID)"
        echo "  Account ID      : $(BOOMI_ACCOUNT_ID)"
        echo "  Package Version : $(Build.BuildNumber)"
        echo ""

        # Call the PackagedComponent API endpoint
        RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
          -u "$(BOOMI_USERNAME):$(BOOMI_API_TOKEN)" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          -d '{
            "componentId": "$(BOOMI_COMPONENT_ID)",
            "packageVersion": "$(Build.BuildNumber)",
            "notes": "Auto-packaged by Azure Pipeline Build $(Build.BuildNumber) from branch $(Build.SourceBranch)"
          }' \
          "https://api.boomi.com/api/rest/v1/$(BOOMI_ACCOUNT_ID)/PackagedComponent")

        # Split response into body and HTTP status
        HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | head -n -1)

        echo "HTTP Status Code: $HTTP_STATUS"
        echo ""
        echo "API Response:"
        echo "$BODY" | python3 -m json.tool
        echo ""

        # Check if API call was successful
        if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
          echo "❌ ERROR: Package creation failed with HTTP $HTTP_STATUS"
          echo "Response body:"
          echo "$BODY"
          exit 1
        fi

        # Extract packageId from JSON response
        PACKAGE_ID=$(echo "$BODY" | python3 -c \
          "import sys, json; data=json.load(sys.stdin); print(data.get('packageId', 'NOT_FOUND'))" 2>/dev/null)

        if [ -z "$PACKAGE_ID" ] || [ "$PACKAGE_ID" == "NOT_FOUND" ]; then
          echo "❌ ERROR: Could not extract packageId from response"
          echo "Full response was:"
          echo "$BODY"
          exit 1
        fi

        echo "✅ Package Created Successfully!"
        echo "   Package ID: $PACKAGE_ID"
        echo ""

        # Save package ID to file for next stage
        mkdir -p $(Build.ArtifactStagingDirectory)
        echo "$PACKAGE_ID" > $(Build.ArtifactStagingDirectory)/package_id.txt
        
        # Also save to pipeline variable for logging
        echo "##vso[task.setvariable variable=PackageId;isOutput=true]$PACKAGE_ID"

      displayName: 'Create Boomi Package via API'
      name: PackageStep

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/package_id.txt'
        artifact: 'boomi-package-info'
        publishLocation: 'pipeline'
      displayName: 'Publish Package ID Artifact'

    - script: |
        echo ""
        echo "Build Stage Summary:"
        echo "  ✅ Package Created"
        echo "  ✅ Package ID Saved"
        echo "  ✅ Artifact Published"
        echo ""
        echo "Ready to deploy to Test environment..."
        
      displayName: 'Build Stage Complete'


# ============================================
# STAGE 2: DEPLOY TO TEST
# ============================================
- stage: DeployTest
  displayName: '🚀 Deploy to Test Environment'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToTestEnv
    displayName: 'Deploy to Test via DeployedPackage API'
    environment: 'Test'
    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              echo "=================================================="
              echo " 🚀 STAGE 2: DEPLOY TO TEST"
              echo "=================================================="
              echo ""
              
            displayName: 'Stage Header'

          # Download the package_id artifact from Build stage
          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: 'boomi-package-info'
              targetPath: '$(Pipeline.Workspace)/artifacts'
            displayName: 'Download Package ID Artifact'

          - script: |
              echo "Reading Package ID from artifact..."
              PACKAGE_ID=$(cat $(Pipeline.Workspace)/artifacts/package_id.txt)
              echo "Package ID: $PACKAGE_ID"
              echo ""

              if [ -z "$PACKAGE_ID" ]; then
                echo "❌ ERROR: Package ID is empty!"
                exit 1
              fi

              echo "Calling DeployedPackage API..."
              echo ""
              echo "Deployment Parameters:"
              echo "  Environment ID  : $(BOOMI_TEST_ENV_ID)"
              echo "  Package ID      : $PACKAGE_ID"
              echo "  Account ID      : $(BOOMI_ACCOUNT_ID)"
              echo ""

              # Call the DeployedPackage API endpoint
              RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                -u "$(BOOMI_USERNAME):$(BOOMI_API_TOKEN)" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -d "{
                  \"environmentId\": \"$(BOOMI_TEST_ENV_ID)\",
                  \"packageId\": \"$PACKAGE_ID\",
                  \"notes\": \"Deployed to TEST by Azure Pipeline Build $(Build.BuildNumber)\"
                }" \
                "https://api.boomi.com/api/rest/v1/$(BOOMI_ACCOUNT_ID)/DeployedPackage")

              HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | head -n -1)

              echo "HTTP Status Code: $HTTP_STATUS"
              echo ""
              echo "API Response:"
              echo "$BODY" | python3 -m json.tool
              echo ""

              # Check if deployment was successful
              if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
                echo "❌ ERROR: Deployment to Test failed with HTTP $HTTP_STATUS"
                echo "Response body:"
                echo "$BODY"
                exit 1
              fi

              # Extract deployment ID
              DEPLOYMENT_ID=$(echo "$BODY" | python3 -c \
                "import sys, json; data=json.load(sys.stdin); print(data.get('deployedPackageId', 'NOT_FOUND'))" 2>/dev/null)

              echo "✅ Deployment Successful!"
              echo "   Deployment ID: $DEPLOYMENT_ID"
              echo ""

            displayName: 'Deploy Package to Test'

          - script: |
              echo "Waiting 10 seconds for deployment to stabilize..."
              sleep 10
              
              PACKAGE_ID=$(cat $(Pipeline.Workspace)/artifacts/package_id.txt)

              echo "Verifying deployment status..."
              echo ""

              # Optional: Verify the deployment via GET API
              VERIFY_RESPONSE=$(curl -s \
                -u "$(BOOMI_USERNAME):$(BOOMI_API_TOKEN)" \
                -H "Accept: application/json" \
                "https://api.boomi.com/api/rest/v1/$(BOOMI_ACCOUNT_ID)/DeployedPackage?packageId=$PACKAGE_ID&environmentId=$(BOOMI_TEST_ENV_ID)")

              echo "Deployment Verification Response:"
              echo "$VERIFY_RESPONSE" | python3 -m json.tool
              echo ""

              echo "✅ Deployment Verification Complete!"

            displayName: 'Verify Deployment Status'
            continueOnError: true  # Don't fail if verification endpoint has issues

          - script: |
              echo ""
              echo "=================================================="
              echo " ✅ DEPLOYMENT TO TEST COMPLETE!"
              echo "=================================================="
              echo ""
              echo "What's Next:"
              echo "  1. Test your process in the Test environment"
              echo "  2. Verify the process is running correctly"
              echo "  3. Check logs in Boomi AtomSphere"
              echo ""
              
            displayName: 'Deployment Complete Summary'


# ============================================
# STAGE 3: SUMMARY
# ============================================
- stage: Summary
  displayName: '📊 Pipeline Summary'
  dependsOn: DeployTest
  condition: always()
  jobs:
  - job: PipelineSummary
    displayName: 'Show Pipeline Results'
    steps:

    - script: |
        echo ""
        echo "╔════════════════════════════════════════════════════════════╗"
        echo "║           🎉 BOOMI AUTOMATION PIPELINE COMPLETE 🎉          ║"
        echo "╚════════════════════════════════════════════════════════════╝"
        echo ""
        echo "Build Information:"
        echo "  Build Number    : $(Build.BuildNumber)"
        echo "  Source Branch   : $(Build.SourceBranch)"
        echo "  Build Status    : $(Agent.JobStatus)"
        echo ""
        echo "Pipeline Stages:"
        echo "  ✅ Stage 1: Build (Create Package)"
        echo "  ✅ Stage 2: Deploy to Test"
        echo ""
        echo "Next Steps:"
        echo "  1. Go to Boomi AtomSphere and verify your process"
        echo "  2. Test the process functionality"
        echo "  3. Check Process Reporting → Execution Details"
        echo ""
        echo "For more details, visit:"
        echo "  Azure Pipeline: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
        echo ""
        
      displayName: 'Show Completion Summary'

    - script: |
        if [ "$(Agent.JobStatus)" == "Failed" ]; then
          echo "❌ Pipeline Failed - Check logs above for errors"
          exit 1
        fi
        
      displayName: 'Final Status Check'