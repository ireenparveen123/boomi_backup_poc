trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: boomi-common-vars   # your variable group name

stages:

# ============================================
# STAGE 1: BUILD — Create the Boomi Package
# ============================================
- stage: Build
  displayName: 'Build - Create Boomi Package'
  jobs:
  - job: CreatePackage
    displayName: 'Call PackagedComponent API'
    steps:

    - script: |
        echo "Creating Boomi Package..."

        # Call the PackagedComponent API
        RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
          -u "$(BOOMI_USERNAME):$(BOOMI_API_TOKEN)" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          -d '{
            "componentId": "$(BOOMI_COMPONENT_ID)",
            "packageVersion": "$(Build.BuildNumber)",
            "notes": "Auto-packaged by Azure Pipeline Build $(Build.BuildNumber)"
          }' \
          "https://api.boomi.com/api/rest/v1/$(BOOMI_ACCOUNT_ID)/PackagedComponent")

        # Split response body and HTTP status code
        HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | head -n -1)

        echo "HTTP Status : $HTTP_STATUS"
        echo "Response    : $BODY"

        # Fail pipeline if API call was unsuccessful
        if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
          echo "❌ ERROR: Package creation failed!"
          exit 1
        fi

        # Extract the packageId from the JSON response
        PACKAGE_ID=$(echo "$BODY" | python3 -c \
          "import sys, json; print(json.load(sys.stdin)['packageId'])")

        echo "✅ Package Created! Package ID: $PACKAGE_ID"

        # Save to a file so next stage can use it
        echo "$PACKAGE_ID" > $(Build.ArtifactStagingDirectory)/package_id.txt

      displayName: 'Create Boomi Package via API'

    # Publish the package_id.txt as a pipeline artifact
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/package_id.txt'
        artifact: 'boomi-package-id'
      displayName: 'Publish Package ID as Artifact'


# ============================================
# STAGE 2: DEPLOY — Deploy to Test Environment
# ============================================
- stage: DeployTest
  displayName: 'Deploy to Test Environment'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToTest
    displayName: 'Call DeployedPackage API - Test'
    environment: 'Test'            # Links to your Azure DevOps Environment
    strategy:
      runOnce:
        deploy:
          steps:

          # Download the package_id.txt artifact from Build stage
          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: 'boomi-package-id'
              targetPath: '$(Pipeline.Workspace)'
            displayName: 'Download Package ID Artifact'

          - script: |
              # Read the package ID saved from the Build stage
              PACKAGE_ID=$(cat $(Pipeline.Workspace)/package_id.txt)
              echo "Deploying Package ID: $PACKAGE_ID to TEST"

              # Call the DeployedPackage API
              RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                -u "$(BOOMI_USERNAME):$(BOOMI_API_TOKEN)" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -d "{
                  \"environmentId\": \"$(BOOMI_TEST_ENV_ID)\",
                  \"packageId\": \"$PACKAGE_ID\",
                  \"notes\": \"Deployed to TEST by Azure Pipeline $(Build.BuildNumber)\"
                }" \
                "https://api.boomi.com/api/rest/v1/$(BOOMI_ACCOUNT_ID)/DeployedPackage")

              HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | head -n -1)

              echo "HTTP Status : $HTTP_STATUS"
              echo "Response    : $BODY"

              if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
                echo "❌ ERROR: Deployment to Test failed!"
                exit 1
              fi

              echo "✅ Successfully deployed to TEST environment!"
            displayName: 'Deploy to Test via API'


# ============================================
# STAGE 3: DEPLOY — Deploy to Production
#          (Requires Manual Approval Gate)
# ============================================
- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: DeployTest
  condition: succeeded()
  jobs:
  - deployment: DeployToProduction
    displayName: 'Call DeployedPackage API - Production'
    environment: 'Production'      # ← Manual approval gate triggers HERE
    strategy:
      runOnce:
        deploy:
          steps:

          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: 'boomi-package-id'
              targetPath: '$(Pipeline.Workspace)'
            displayName: 'Download Package ID Artifact'

          - script: |
              PACKAGE_ID=$(cat $(Pipeline.Workspace)/package_id.txt)
              echo "Deploying Package ID: $PACKAGE_ID to PRODUCTION"

              RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                -u "$(BOOMI_USERNAME):$(BOOMI_API_TOKEN)" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json" \
                -d "{
                  \"environmentId\": \"$(BOOMI_PROD_ENV_ID)\",
                  \"packageId\": \"$PACKAGE_ID\",
                  \"notes\": \"Deployed to PROD by Azure Pipeline $(Build.BuildNumber)\"
                }" \
                "https://api.boomi.com/api/rest/v1/$(BOOMI_ACCOUNT_ID)/DeployedPackage")

              HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
              BODY=$(echo "$RESPONSE" | head -n -1)

              echo "HTTP Status : $HTTP_STATUS"
              echo "Response    : $BODY"

              if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
                echo "❌ ERROR: Deployment to Production failed!"
                exit 1
              fi

              echo "✅ Successfully deployed to PRODUCTION!"
            displayName: 'Deploy to Production via API'