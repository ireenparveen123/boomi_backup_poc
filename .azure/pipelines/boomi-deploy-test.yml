# =============================================
# Azure Pipeline: Boomi Deploy to Test
# Trigger: Push to main branch
# =============================================

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

# Link Variable Groups
variables:
  - group: boomi-common-vars
  - group: boomi-test-vars
  - name: PACKAGE_VERSION
    value: '$(Build.BuildNumber)'
  - name: RELEASE_NOTES
    value: 'Build $(Build.BuildNumber) - $(Build.SourceVersionMessage)'

stages:

# -----------------------------------------------
# STAGE 1: Validate & Prepare
# -----------------------------------------------
- stage: Validate
  displayName: 'Validate & Prepare'
  jobs:
  - job: ValidateConfig
    displayName: 'Validate Configuration'
    steps:
    - checkout: self

    - script: |
        echo "Validating pipeline configuration..."
        echo "Account ID  : $(BOOMI_ACCOUNT_ID)"
        echo "Environment : $(ENV_NAME)"
        echo "Build Number: $(Build.BuildNumber)"
        
        # Validate required files exist
        test -f components/component_ids.json && echo "✅ component_ids.json found" || exit 1
        test -f scripts/package_component.sh && echo "✅ package_component.sh found" || exit 1
        test -f scripts/deploy_component.sh && echo "✅ deploy_component.sh found" || exit 1
        
        echo "✅ All validations passed"
      displayName: 'Validate Required Files'

    - script: |
        chmod +x scripts/*.sh
        echo "✅ Script permissions set"
      displayName: 'Set Script Permissions'

# -----------------------------------------------
# STAGE 2: Package Components
# -----------------------------------------------
- stage: Package
  displayName: 'Package Boomi Components'
  dependsOn: Validate
  condition: succeeded()
  jobs:
  - job: PackageComponents
    displayName: 'Create Packaged Components'
    steps:
    - checkout: self

    - script: |
        chmod +x scripts/package_component.sh
        
        # Loop through all components and package them
        COMPONENT_COUNT=$(python3 -c "
        import json
        with open('components/component_ids.json') as f:
            data = json.load(f)
        print(len(data['components']))
        ")
        
        echo "Found $COMPONENT_COUNT component(s) to package"
        
        python3 -c "
        import json, subprocess, sys

        with open('components/component_ids.json') as f:
            data = json.load(f)

        for comp in data['components']:
            print(f'Packaging: {comp[\"name\"]}')
            result = subprocess.run([
                './scripts/package_component.sh',
                '$(BOOMI_ACCOUNT_ID)',
                '$(BOOMI_USERNAME)',
                '$(BOOMI_API_TOKEN)',
                comp['componentId'],
                '$(PACKAGE_VERSION)',
                '$(RELEASE_NOTES)'
            ], capture_output=True, text=True)
            print(result.stdout)
            if result.returncode != 0:
                print(result.stderr)
                sys.exit(1)
        "
      displayName: 'Package All Components'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'package_id.txt'
        artifact: 'package-ids'
        publishLocation: 'pipeline'
      displayName: 'Publish Package ID Artifact'

# -----------------------------------------------
# STAGE 3: Deploy to Test
# -----------------------------------------------
- stage: DeployTest
  displayName: 'Deploy to Test Environment'
  dependsOn: Package
  condition: succeeded()
  jobs:
  - deployment: DeployToTest
    displayName: 'Deploy to Test'
    environment: 'Test'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: 'package-ids'
              targetPath: '$(System.DefaultWorkingDirectory)'
            displayName: 'Download Package IDs'

          - script: |
              chmod +x scripts/deploy_component.sh
              ./scripts/deploy_component.sh \
                "$(BOOMI_ACCOUNT_ID)" \
                "$(BOOMI_USERNAME)" \
                "$(BOOMI_API_TOKEN)" \
                "$(ENV_ID)" \
                "$(ENV_NAME)"
            displayName: 'Deploy to Test Environment'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'deployment_id.txt'
              artifact: 'deployment-ids'
              publishLocation: 'pipeline'
            displayName: 'Publish Deployment ID'

# -----------------------------------------------
# STAGE 4: Smoke Test
# -----------------------------------------------
- stage: SmokeTest
  displayName: 'Run Smoke Tests'
  dependsOn: DeployTest
  condition: succeeded()
  jobs:
  - job: RunSmokeTests
    displayName: 'Execute Smoke Tests'
    steps:
    - script: |
        echo "Running smoke tests against Test environment..."
        
        # Check if process is deployed and active
        RESPONSE=$(curl -s \
          -u "$(BOOMI_USERNAME):$(BOOMI_API_TOKEN)" \
          -H "Accept: application/json" \
          "$(BOOMI_BASE_URL)/$(BOOMI_ACCOUNT_ID)/DeployedPackage/$(cat deployment_id.txt)")
        
        echo "Deployment Status Response: $RESPONSE"
        
        STATUS=$(echo "$RESPONSE" | python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        print(data.get('status', 'unknown'))
        ")
        
        echo "Deployment Status: $STATUS"
        
        if [ "$STATUS" != "DEPLOYED" ]; then
          echo "ERROR: Deployment status is not DEPLOYED"
          exit 1
        fi
        
        echo "✅ Smoke tests passed"
      displayName: 'Verify Deployment Status'