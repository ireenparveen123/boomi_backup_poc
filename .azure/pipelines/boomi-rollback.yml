# =============================================
# Azure Pipeline: Boomi Rollback
# Trigger: Manual only
# =============================================

trigger: none

parameters:
  - name: environment
    displayName: 'Environment to Rollback'
    type: string
    values:
      - Test
      - Production
  - name: previousPackageId
    displayName: 'Previous Package ID to Restore'
    type: string

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: boomi-common-vars
  - ${{ if eq(parameters.environment, 'Test') }}:
    - group: boomi-test-vars
  - ${{ if eq(parameters.environment, 'Production') }}:
    - group: boomi-prod-vars

stages:
- stage: Rollback
  displayName: 'Rollback ${{ parameters.environment }}'
  jobs:
  - deployment: ExecuteRollback
    environment: '${{ parameters.environment }}'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - script: |
              chmod +x scripts/rollback.sh
              ./scripts/rollback.sh \
                "$(BOOMI_ACCOUNT_ID)" \
                "$(BOOMI_USERNAME)" \
                "$(BOOMI_API_TOKEN)" \
                "$(ENV_ID)" \
                "${{ parameters.previousPackageId }}"
            displayName: 'Execute Rollback'